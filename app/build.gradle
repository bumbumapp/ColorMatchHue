apply plugin: 'com.android.application'

// Huawei Ads (Petal) slot IDs for the AppGallery build: -PHMS_INTERSTITIAL_ID=... / -PHMS_REWARDED_ID=... or ads.properties.
// Until the real slots are set the hms build falls back to Huawei's public test slots.
def hmsAdsProps = new Properties()
def hmsAdsPropsFile = rootProject.file('ads.properties')
if (hmsAdsPropsFile.exists()) hmsAdsPropsFile.withInputStream { hmsAdsProps.load(it) }
def hmsAdId = { String key, String fallback -> ((project.findProperty(key) ?: hmsAdsProps.getProperty(key)) ?: fallback).toString() }
def HMS_TEST_INTERSTITIAL_ID = 'testb4znbuh3n2'
def HMS_INTERSTITIAL_ID = hmsAdId('HMS_INTERSTITIAL_ID', HMS_TEST_INTERSTITIAL_ID)
def HMS_TEST_REWARDED_ID = 'testx9dtjwj8hp'
def HMS_REWARDED_ID = hmsAdId('HMS_REWARDED_ID', HMS_TEST_REWARDED_ID)
// Firebase config is not committed; apply the plugins only when google-services.json is present.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.bumbumapps.hue'
    compileSdk 36
    defaultConfig {
        applicationId "com.bumbumapps.huecolorsmatching"
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        resValues true
    }
    // play = Google Play (AdMob + UMP), hms = Huawei AppGallery (Huawei Ads, no Google Mobile Services).
    flavorDimensions = ['store']
    productFlavors {
        play {
            dimension 'store'
        }
        hms {
            dimension 'store'
            resValue 'string', 'hms_interstitial_id', HMS_INTERSTITIAL_ID
            resValue 'string', 'hms_test_interstitial_id', HMS_TEST_INTERSTITIAL_ID
            resValue 'string', 'hms_rewarded_id', HMS_REWARDED_ID
            resValue 'string', 'hms_test_rewarded_id', HMS_TEST_REWARDED_ID
        }
    }

    buildTypes {
        debug {
            // Google sample IDs: debug builds never request live ads.
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
            resValue "string", "admob_interstitial_id", "ca-app-pub-3940256099942544/1033173712"
            resValue "string", "admob_rewarded_id", "ca-app-pub-3940256099942544/5224354917"
        }
        release {
            manifestPlaceholders = [admobAppId: "ca-app-pub-8444865753152507~2581880390"]
            resValue "string", "admob_interstitial_id", "ca-app-pub-8444865753152507/6422259921"
            resValue "string", "admob_rewarded_id", "ca-app-pub-8444865753152507/3060392547"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.13.0'
    playImplementation 'com.google.android.gms:play-services-ads:25.5.0'
    playImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    hmsImplementation 'com.huawei.hms:ads-lite:13.4.91.301'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
